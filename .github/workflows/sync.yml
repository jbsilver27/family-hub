name: Sync State
on:
  workflow_dispatch:
    inputs:
      data:
        description: 'Sync state JSON (base64 encoded)'
        required: true
        default: 'e30='
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write sync.json
        run: echo "$DATA" | base64 -d | sed 's/ghp_[A-Za-z0-9]\+/REMOVED/g' > sync.json
        env:
          DATA: ${{ github.event.inputs.data }}
      - name: Commit
        run: |
          git config user.name "FamilyHub Sync"
          git config user.email "sync@familyhub.local"
          git add sync.json
          git diff --staged --quiet || git commit -m "sync"
          git push
