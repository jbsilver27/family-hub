name: Sync State
on:
  workflow_dispatch:
    inputs:
      data:
        description: 'Sync state JSON (base64 encoded)'
        required: true
        default: 'e30='
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write sync.json
        run: |
          python3 - <<'PYEOF'
import base64, json, sys, re
data = """${{ github.event.inputs.data }}"""
try:
    decoded = base64.b64decode(data.strip()).decode("utf-8")
    obj = json.loads(decoded)
    if "state" in obj and "settings" in obj["state"]:
        obj["state"]["settings"].pop("syncCode", None)
    cleaned = json.dumps(obj)
    cleaned = re.sub(r'ghp_[A-Za-z0-9]+', 'REMOVED', cleaned)
except Exception:
    cleaned = '{"ts":0,"state":{}}'
with open("sync.json", "w") as f:
    f.write(cleaned)
PYEOF
        env:
          DATA: ${{ github.event.inputs.data }}
      - name: Commit
        run: |
          git config user.name "FamilyHub Sync"
          git config user.email "sync@familyhub.local"
          git add sync.json
          git diff --staged --quiet || git commit -m "sync"
          git push
